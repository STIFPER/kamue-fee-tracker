<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3A2C28">
<!-- ทำให้รู้สึกเหมือนแอปจริงมากขึ้นตอนเปิดในเบราว์เซอร์มือถือ/เพิ่มไปหน้าโฮม: ปิดแถบเบราว์เซอร์ (standalone), ปิดซูม -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ค่ามือ">
<title>ค่ามือ · Smart Compensation Platform for Medical Assistants</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- display=optional (ไม่ใช่ swap) — ถ้าฟอนต์โหลดไม่ทันในช่วงสั้นๆ แรก จะใช้ฟอนต์สำรองไปเลยไม่มีการ "สลับ" ให้เห็นภายหลัง
     กันอาการฟอนต์กระพริบตอนเปิดบนมือถือ เน็ตช้า — เยี่ยมครั้งถัดไปจะเร็วขึ้นเพราะ service worker แคชไฟล์ฟอนต์ไว้แล้ว -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=optional" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<!-- Critical CSS แบบ inline — สีพื้นหลัง + splash โชว์ได้ทันทีตั้งแต่ parse HTML เสร็จ โดยไม่ต้องรอ styles.css โหลด
     กันจอขาววาบตอนเปิดแอปครั้งแรกบนมือถือ (ตัด layout/สไตล์อื่นออกให้เหลือแค่ส่วนที่ต้องโชว์ก่อนใครเพื่อน) -->
<style>
  html, body { margin: 0; background: #ECE5DD; }
  #splash {
    position: fixed; inset: 0; z-index: 99999;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: #ECE5DD;
  }
  #splash .splash-mark {
    width: 64px; height: 64px; border-radius: 18px;
    box-shadow: 0 10px 28px rgba(58, 44, 40, 0.18);
    animation: splashPulse 1.6s ease-in-out infinite;
  }
  #splash .splash-mark svg { display: block; width: 100%; height: 100%; }
  #splash .splash-name {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px; font-weight: 600; color: #6E594B; letter-spacing: .02em;
  }
  @keyframes splashPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .82; transform: scale(.96); }
  }
</style>
</head>
<body>

<div id="splash">
  <div class="splash-mark">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" rx="22" ry="22" fill="#ebe2d9"/>
      <g fill="#6e594b">
        <path d="M54.5,48.1c3-4.8,6.2-9.2,9.9-13.4s2.8-2.6,4.5-2.5,2.7,2.4,1.9,3.9c-2.6,5.5-12.3,15.3-10.5,17.4s1.3.5,1.7.2l3.8-2.6c4.4-3,10.1-3.4,13.3,1,5.7,7.8-5.9,17.7-12.9,22.6s-24.4,10-35.3,4.5c-5.8-2.9-9.7-8.2-10.9-14.5-2.1-11,.9-22.8,6.4-32.4s4.9-8.4,9.2-10c.7-.3,1.4-.5,2.1-.4s1.5.5,1.8,1.1c.5,1.1-.2,2.3-.9,3.2-2.9,4.1-6,8.1-8.1,12.7s-3.4,9-4.1,13.7c-1.2,8,0,17,7.7,20.6s20.1,1.2,28-3.9,6.7-4.9,9.6-7.8,1.9-2.5,2.3-3.8-.7-2.5-2-2.5c-1.8,0-3.2.9-4.6,2-2.1,1.7-4.6,2.9-7.3,2.9-3.9,0-6.9-3.1-6.8-6.9s.2-3.4,1.3-5.1Z"/>
        <path d="M45.5,60.3c1.6-.9,3.4,0,4.2,1.2s.8,3.2-.6,4.4c-4.1,3.4-11.7,4.3-15.7.3s-2.6-3.1-2.1-5.1.8-1.4,1.2-1.6c2.1-1.1,4.6,5.5,13,.8Z"/>
        <path d="M41.8,41c-.8,3.5-4.9,2.1-5.5,4.4,0,.9.7,1.6,1,2.4,1.2,2.6-2.1,5.2-4.3,3.3-2.6-2.3.1-7.7,1-10.6.5-1.4,1.2-2.8,2.6-3.5,2.8-1.3,6,.6,5.2,3.9h0Z"/>
        <path d="M52.8,42.8c-.8,3.5-4.9,2.1-5.5,4.4,0,.9.7,1.6,1,2.4,1.2,2.6-2.1,5.2-4.3,3.3-2.6-2.3.1-7.7,1-10.6.5-1.4,1.2-2.8,2.6-3.5,2.8-1.3,6,.6,5.2,3.9h0Z"/>
        <path d="M54.4,35.4c-.5,0-.9-.1-1.4-.4-1.3-.8-1.8-2.4-1-3.7,2-3.4,5.1-6.2,8.8-7.7,1.4-.6,3,0,3.6,1.5.6,1.4,0,3-1.5,3.6-2.6,1.1-4.7,3-6.1,5.4-.5.9-1.4,1.4-2.4,1.4Z"/>
        <path d="M43.8,33c-.4,0-.8,0-1.2-.3-1.4-.7-1.9-2.3-1.3-3.7,2.5-5.2,7-9.6,11.2-11,1.4-.5,3,.3,3.5,1.7.5,1.4-.3,3-1.7,3.5-2.3.8-5.9,3.9-7.9,8.1-.5,1-1.5,1.6-2.5,1.6Z"/>
      </g>
    </svg>
  </div>
  <div class="splash-name">ค่ามือ</div>
</div>

<div class="liquid-bg-container">
  <div class="liquid-blob blob-1"></div>
  <div class="liquid-blob blob-2"></div>
  <div class="liquid-blob blob-3"></div>
  <div class="liquid-blob blob-4"></div>
</div>

<div id="onboarding" class="onboarding hidden" style="width:100%;">
  <div class="onboarding-card">
    <div class="brand-kicker">Smart Compensation Platform for Medical Assistants</div>
    <h1 class="onboarding-title">Welcome Back</h1>
    <p class="onboarding-lead">Sign in with Google to securely sync your daily cases and track earnings on the clinic cloud.</p>
    <button id="btn-google-login" class="btn btn-primary btn-block btn-google">
      <svg width="18" height="18" viewBox="0 0 18 18" style="margin-right:8px;vertical-align:-3px"><path fill="#fff" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62Z"/><path fill="#fff" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18Z"/><path fill="#fff" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33Z"/><path fill="#fff" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.42 0 9 0A9 9 0 0 0 .98 4.97L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58Z"/></svg>
      Continue with Google
    </button>
    <div id="onboarding-switch"></div>
  </div>
</div>

<div id="name-modal" class="modal-backdrop">
  <div class="modal-card">
    <div class="modal-title">เริ่มต้นใช้งาน</div>
    <label class="field-label">ชื่อของคุณ</label>
    <input id="input-name" class="field-input" placeholder="เช่น พิชญา" maxlength="40">
    <label class="field-label" style="margin-top:14px">บทบาท (สำหรับทดลองระบบ)</label>
    <select id="input-role" class="field-input">
      <option value="assistant">ผู้ช่วยแพทย์ · Assistant</option>
      <option value="admin">ผู้ดูแล · Admin</option>
      <option value="super_admin">ผู้ดูแลสูงสุด · Super Admin</option>
    </select>
    <div class="modal-actions">
      <button id="btn-cancel-name" class="btn btn-ghost">ยกเลิก</button>
      <button id="btn-confirm-name" class="btn btn-primary">เริ่มใช้งาน</button>
    </div>
  </div>
</div>

<!-- แทนที่ window.prompt() — ใช้งานไม่ได้เลยตอนเปิดแอปแบบ "เพิ่มไปหน้าโฮมสกรีน" (standalone) บน iOS Safari
     ทำให้กรอกจำนวนที่ต้องพิมพ์เอง (cc แม่นยำ, ชั่วโมง OR) เงียบๆ ไม่มีอะไรขึ้นมาให้กรอกเลย -->
<div id="qty-modal" class="modal-backdrop">
  <div class="modal-card">
    <div class="modal-title" id="qty-modal-title">จำนวน</div>
    <label class="field-label" id="qty-modal-label">จำนวน</label>
    <input id="qty-modal-input" class="field-input" type="number" inputmode="decimal" step="any" min="0">
    <div class="modal-actions">
      <button id="btn-qty-cancel" class="btn btn-ghost">ยกเลิก</button>
      <button id="btn-qty-confirm" class="btn btn-primary">ยืนยัน</button>
    </div>
  </div>
</div>

<div id="app" class="app hidden">
  <header class="topbar">
    <button id="btn-hamburger" class="hamburger-btn" aria-label="เปิดเมนู">
      <span></span><span></span><span></span>
    </button>
    <nav class="topnav" id="topnav"></nav>
    <button id="btn-profile" class="profile-chip"></button>
  </header>

  <main id="view-root" class="view-root"></main>

  <button id="btn-fab" class="fab" aria-label="เพิ่มรายการวันนี้">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>

  <nav class="bottomnav" id="bottomnav"></nav>
</div>

<div id="drawer-backdrop" class="drawer-backdrop"></div>
<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-header">
    <div class="drawer-profile" id="drawer-profile"></div>
    <button id="btn-drawer-close" class="drawer-close-btn" aria-label="ปิดเมนู">✕</button>
  </div>
  <nav class="drawer-nav" id="drawer-nav"></nav>
  <div class="drawer-footer">
    <button id="btn-drawer-logout" class="btn btn-ghost btn-block">ออกจากระบบ</button>
  </div>
</aside>

<div id="toast" class="toast"></div>

<!-- Loading overlay -->
<div id="loader" class="modal-backdrop hidden loader-container" style="background:rgba(58,44,40,0.85);z-index:9999;color:#F5EBE6;font-size:15px;font-weight:500;">
  <div class="loader-spinner"></div>
  <span>กำลังโหลดข้อมูล...</span>
</div>

<!-- defer ทุกสคริปต์ — ให้เบราว์เซอร์โหลดไฟล์เหล่านี้ขนานกันได้ทันทีระหว่างพาร์สหน้า แทนที่จะรอโหลด+รันทีละไฟล์ตามลำดับ
     (ลำดับการรันยังเหมือนเดิมตามที่เขียนไว้ เพราะ defer รันตามลำดับเอกสารเสมอ) -->
<!-- Firebase SDK (Compat Version) -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js" defer></script>

<!-- App configurations and scripts -->
<script src="data/config.js" defer></script>
<script src="data/catalog.js" defer></script>
<script src="data/store.js" defer></script>
<script src="data/calc.js" defer></script>
<script src="views.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
